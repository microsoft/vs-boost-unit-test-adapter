pr:
  autoCancel: true
  branches:
    include:
    - refs/heads/main
    - refs/heads/dev17
    - refs/heads/dev15
    - dev/*
name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: MicroBuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release
  - repository: VCLS-Extensions
    type: git
    name: VCLS-Extensions
    ref: refs/heads/dev17
extends:
  template: azure-pipelines/MicroBuild.1ES.Unofficial.yml@MicroBuildTemplate
  parameters:
    pool:
      name: VSEngSS-MicroBuild2022-1ES
    sdl:
      sourceAnalysisPool:
        name: VSEngSS-MicroBuild2022-1ES
      sourceRepositoriesToScan:
        exclude:
        # No need to scan this source as we only use this repo to copy the public signing key.
        - repository: VCLS-Extensions
      tsa:
        enabled: true
        configFile: '$(Build.SourcesDirectory)\TSAOptions.json'
      enableAllTools: false # To improve performance in PR pipeline
    customBuildTags:
    - ES365AIMigrationTooling
    stages:
    - stage: stage
      jobs:
      - template: /pipeline/common.yml@self
        parameters:
          IsProd: false
